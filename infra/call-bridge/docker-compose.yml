services:
  media-gateway:
    build:
      context: ./media_gateway
    environment:
      NOVA_AUDIO_SOCKET_HOST: 0.0.0.0
      NOVA_AUDIO_SOCKET_PORT: 9019
      NOVA_HEALTH_PORT: 8080
      NOVA_REPORT_DIR: /reports
      NOVA_ASR_ENCODER: /models/asr/encoder.onnx
      NOVA_ASR_DECODER: /models/asr/decoder.onnx
      NOVA_ASR_TOKENS: /models/asr/tokens.txt
      NOVA_TTS_MODEL: /models/tts/model.onnx
      NOVA_TTS_TOKENS: /models/tts/tokens.txt
      NOVA_TTS_DATA: /models/tts/espeak-ng-data
      NOVA_CALL_AI_PROVIDER: ${NOVA_CALL_AI_PROVIDER:-mock}
      NOVA_CALL_AI_KEY: ${NOVA_CALL_AI_KEY:-}
      NOVA_CALL_AI_MODEL: ${NOVA_CALL_AI_MODEL:-}
      NOVA_CALL_AI_ENDPOINT: ${NOVA_CALL_AI_ENDPOINT:-}
      NOVA_CALL_HANGUP_AFTER_REPLY: ${NOVA_CALL_HANGUP_AFTER_REPLY:-true}
      NOVA_CALL_MOCK_REPLY: ${NOVA_CALL_MOCK_REPLY:-NOVA çift yönlü çağrı medya testi başarıyla tamamlandı.}
      NOVA_LOG_LEVEL: ${NOVA_LOG_LEVEL:-INFO}
    volumes:
      - ../../android/app/src/main/assets/sherpa_asr:/models/asr:ro
      - ../../android/app/src/main/assets/sherpa_tts:/models/tts:ro
      - ./runtime/reports:/reports
      - ./runtime:/shared
    ports:
      - "18080:8080"
    restart: unless-stopped
    networks:
      - nova-call

  call-control:
    build:
      context: ./control_gateway
    environment:
      NOVA_CALL_CONTROL_HOST: 0.0.0.0
      NOVA_CALL_CONTROL_PORT: 8090
      NOVA_CALL_CONTROL_TOKEN: ${NOVA_CALL_CONTROL_TOKEN:-nova-ci-control-token-not-for-production}
      NOVA_ASTERISK_AMI_HOST: asterisk
      NOVA_ASTERISK_AMI_PORT: 5038
      NOVA_ASTERISK_AMI_USER: ${NOVA_ASTERISK_AMI_USER:-nova-control}
      NOVA_ASTERISK_AMI_SECRET: ${NOVA_ASTERISK_AMI_SECRET:-nova-ci-ami-secret-not-for-production}
      NOVA_MEDIA_GATEWAY_BASE_URL: http://media-gateway:8080
      NOVA_CALL_CONTROL_DATA_DIR: /shared/control
    volumes:
      - ./runtime:/shared
    ports:
      - "18090:8090"
    depends_on:
      media-gateway:
        condition: service_healthy
      asterisk:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - nova-call

  asterisk:
    build:
      context: ./asterisk
    environment:
      NOVA_SIP_TRUNK_HOST: ${NOVA_SIP_TRUNK_HOST:-}
      NOVA_SIP_TRUNK_USER: ${NOVA_SIP_TRUNK_USER:-}
      NOVA_SIP_TRUNK_PASSWORD: ${NOVA_SIP_TRUNK_PASSWORD:-}
      NOVA_SIP_TRUNK_FROM_DOMAIN: ${NOVA_SIP_TRUNK_FROM_DOMAIN:-}
      NOVA_ASTERISK_AMI_SECRET: ${NOVA_ASTERISK_AMI_SECRET:-nova-ci-ami-secret-not-for-production}
    volumes:
      - ./runtime:/shared
    ports:
      - "15060:5060/udp"
      - "15060:5060/tcp"
    depends_on:
      media-gateway:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - nova-call

networks:
  nova-call:
    driver: bridge
