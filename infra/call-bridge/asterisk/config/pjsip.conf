[global]
type=global
user_agent=NOVA-Call-Bridge/1.0
endpoint_identifier_order=ip,username,anonymous

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
local_net=10.0.0.0/8
local_net=172.16.0.0/12
local_net=192.168.0.0/16

; Local laboratory endpoints. They are not exposed by the CI compose file and
; exist for packet-level SIP tests and manual LAN testing.
[nova-lab-auth]
type=auth
auth_type=userpass
username=nova-lab
password=nova-lab-ci-only

[nova-lab-aor]
type=aor
max_contacts=2
remove_existing=yes
qualify_frequency=30

[nova-lab]
type=endpoint
transport=transport-udp
context=from-nova-carrier
disallow=all
allow=ulaw
allow=alaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
auth=nova-lab-auth
aors=nova-lab-aor

#include pjsip.carrier.conf
