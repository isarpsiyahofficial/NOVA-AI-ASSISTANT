[general]
static=yes
writeprotect=no
autofallthrough=yes
clearglobalvars=no

[globals]
NOVA_AUDIO_SOCKET=media-gateway:9019

; Real inbound PSTN/SIP calls arrive here through the configured carrier trunk.
[from-nova-carrier]
exten => _X!,1,NoOp(NOVA inbound carrier call from ${CALLERID(all)} to ${EXTEN})
 same => n,Answer()
 same => n,Set(NOVA_CALL_UUID=${UUID()})
 same => n,Set(CHANNEL(language)=tr)
 same => n,Set(CDR(userfield)=nova-bridge-${NOVA_CALL_UUID})
 same => n,MixMonitor(/shared/recordings/carrier-${NOVA_CALL_UUID}.wav,b)
 same => n,AudioSocket(${NOVA_CALL_UUID},${NOVA_AUDIO_SOCKET})
 same => n,StopMixMonitor()
 same => n,Hangup()

; Owner-approved outbound calls use the carrier trunk. The trunk template is
; rendered only when NOVA_SIP_TRUNK_* variables are present.
[nova-outbound]
exten => _X!,1,NoOp(NOVA owner-approved outbound call ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN}@nova-carrier,60,b(nova-outbound-proof^s^1))
 same => n,Hangup()

[nova-outbound-proof]
exten => s,1,Set(CDR(userfield)=nova-owner-approved-outbound)
 same => n,Return()

; CI caller leg: plays a real Turkish TTS command and records everything heard
; on the bridged channel, including NOVA's injected TTS response.
[nova-test-caller]
exten => 9000,1,NoOp(NOVA deterministic two-way media caller)
 same => n,Answer()
 same => n,Set(NOVA_TEST_ID=${UUID()})
 same => n,MixMonitor(/shared/recordings/test-caller-${NOVA_TEST_ID}.wav,b)
 same => n,Wait(1)
 same => n,Playback(nova-e2e/nova-test-command)
 same => n,Wait(12)
 same => n,StopMixMonitor()
 same => n,Hangup()

; CI bridge leg: identical to the production AudioSocket route. The originate
; command connects Local/9000@nova-test-caller to extension 7000 below.
[nova-call-test]
exten => 7000,1,NoOp(NOVA AudioSocket end-to-end test leg)
 same => n,Answer()
 same => n,Set(NOVA_CALL_UUID=${UUID()})
 same => n,AudioSocket(${NOVA_CALL_UUID},${NOVA_AUDIO_SOCKET})
 same => n,Hangup()
