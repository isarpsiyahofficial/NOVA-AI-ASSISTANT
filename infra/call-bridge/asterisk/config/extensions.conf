[general]
static=yes
writeprotect=no
autofallthrough=yes
clearglobalvars=no

[globals]
NOVA_AUDIO_SOCKET=media-gateway:9019

[from-nova-carrier]
exten => _X!,1,NoOp(NOVA inbound carrier call from ${CALLERID(all)} to ${EXTEN})
 same => n,Answer()
 same => n,Set(NOVA_CALL_UUID=${FILTER(0-9a-f-,${SHELL(uuidgen)})})
 same => n,Set(CHANNEL(language)=tr)
 same => n,Set(CDR(userfield)=nova-bridge-${NOVA_CALL_UUID})
 same => n,MixMonitor(/shared/recordings/carrier-${NOVA_CALL_UUID}.wav,b)
 same => n,AudioSocket(${NOVA_CALL_UUID},${NOVA_AUDIO_SOCKET})
 same => n,StopMixMonitor()
 same => n,Hangup()

[nova-outbound]
exten => _X!,1,NoOp(NOVA owner-approved outbound call ${EXTEN})
 same => n,GotoIf($["${NOVA_OWNER_APPROVED}"="1"]?approved:blocked)
 same => n(approved),Dial(PJSIP/${EXTEN}@nova-carrier,60,b(nova-outbound-proof^s^1))
 same => n,Hangup()
 same => n(blocked),NoOp(NOVA outbound call blocked without owner approval)
 same => n,Hangup(21)

[nova-outbound-proof]
exten => s,1,Set(CDR(userfield)=nova-owner-approved-outbound)
 same => n,Return()

[nova-test-caller]
exten => 9000,1,NoOp(NOVA deterministic two-way media caller)
 same => n,Answer()
 same => n,Set(NOVA_TEST_ID=${FILTER(0-9a-f-,${SHELL(uuidgen)})})
 same => n,MixMonitor(/shared/recordings/test-caller-${NOVA_TEST_ID}.wav,b)
 same => n,Wait(15)
 same => n,StopMixMonitor()
 same => n,Hangup()

[nova-call-test]
exten => 7000,1,NoOp(NOVA bridged AudioSocket end-to-end test leg)
 same => n,Answer()
 same => n,Set(NOVA_CALL_UUID=${FILTER(0-9a-f-,${SHELL(uuidgen)})})
 same => n,Set(CHANNEL(language)=tr)
 ; Use the AudioSocket channel driver so Dial creates a real media bridge.
 ; The A() announcement is played to the called AudioSocket channel only; once
 ; it finishes, the bridge remains up for the generated TTS reply to return to
 ; the deterministic Local caller and its MixMonitor recording.
 same => n,Dial(AudioSocket/${NOVA_AUDIO_SOCKET}/${NOVA_CALL_UUID}/c(slin),20,A(nova-e2e/nova-test-command))
 same => n,Hangup()
