name: Nova Runtime Integrity

on:
  push:
    branches:
      - main
      - agent/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: nova-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format changed runtime files in CI workspace
        run: >-
          dart format
          lib/main.dart
          lib/core/turn/nova_core_turn_controller.dart
          lib/services/runtime/nova_runtime_graph_service.dart
          lib/services/asr/nova_streaming_asr_runtime_service.dart
          lib/services/asr/nova_streaming_transcript_router_service.dart
          lib/services/audio_runtime/nova_playback_echo_filter_service.dart
          lib/services/stt/nova_speech_to_text_service.dart
          lib/services/tts/nova_tts_service.dart
          test/runtime/nova_runtime_integrity_contract_test.dart

      - name: Run runtime integrity contracts
        run: flutter test test/runtime/nova_runtime_integrity_contract_test.dart

      - name: Analyze runtime entry points
        run: >-
          flutter analyze
          lib/main.dart
          lib/core/turn/nova_core_turn_controller.dart
          lib/services/runtime/nova_runtime_graph_service.dart
          lib/services/asr/nova_streaming_asr_runtime_service.dart
          lib/services/asr/nova_streaming_transcript_router_service.dart
          lib/services/audio_runtime/nova_playback_echo_filter_service.dart
          lib/services/stt/nova_speech_to_text_service.dart
          lib/services/tts/nova_tts_service.dart

      - name: Compile debug APK
        run: flutter build apk --debug --no-pub
