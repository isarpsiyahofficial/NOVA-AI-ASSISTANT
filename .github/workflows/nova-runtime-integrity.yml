name: Nova Runtime Integrity

on:
  push:
    branches:
      - main
      - agent/**
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: nova-runtime-${{ github.ref }}
  cancel-in-progress: true

env:
  SHERPA_ONNX_VERSION: '1.13.2'

jobs:
  source-hotfix:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Add required TelecomManager import
        id: repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('android/app/src/main/kotlin/com/example/nova/NovaCallControlBridge.kt')
          source = path.read_text(encoding='utf-8')
          required = 'import android.telecom.TelecomManager\n'
          anchor = 'import android.telecom.CallEndpointException\n'
          if required not in source:
              if anchor not in source:
                  raise SystemExit('Telecom import anchor is missing.')
              source = source.replace(anchor, anchor + required, 1)
              path.write_text(source, encoding='utf-8')
          PY
          if git diff --quiet -- android/app/src/main/kotlin/com/example/nova/NovaCallControlBridge.kt; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Commit source hotfix
        if: steps.repair.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/app/src/main/kotlin/com/example/nova/NovaCallControlBridge.kt
          git commit -m 'Fix missing TelecomManager import'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

  runtime-contracts:
    needs: source-hotfix
    if: always() && (needs.source-hotfix.result == 'success' || needs.source-hotfix.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Bootstrap verified Gradle wrapper
        shell: bash
        run: |
          chmod +x tooling/bootstrap_gradle_wrapper.sh
          tooling/bootstrap_gradle_wrapper.sh

      - name: Restore verified voice model cache
        uses: actions/cache@v4
        with:
          path: .cache/nova-native-voice
          key: nova-native-voice-${{ env.SHERPA_ONNX_VERSION }}-${{ hashFiles('tooling/prepare_native_voice_assets.sh') }}
          restore-keys: |
            nova-native-voice-${{ env.SHERPA_ONNX_VERSION }}-

      - name: Provision official sherpa voice assets
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          chmod +x tooling/prepare_native_voice_assets.sh
          tooling/prepare_native_voice_assets.sh

      - name: Install dependencies
        run: flutter pub get

      - name: Format changed runtime files in CI workspace
        run: >-
          dart format
          lib/main.dart
          lib/core/turn/nova_core_turn_controller.dart
          lib/services/runtime/nova_runtime_graph_service.dart
          lib/services/asr/nova_streaming_asr_runtime_service.dart
          lib/services/asr/nova_streaming_transcript_router_service.dart
          lib/services/audio_runtime/nova_playback_echo_filter_service.dart
          lib/services/identity/nova_voice_identity_bridge_service.dart
          lib/services/stt/nova_speech_to_text_service.dart
          lib/services/tts/nova_tts_service.dart
          lib/ui/launch/nova_launch_gate_page.dart
          lib/ui/onboarding/nova_first_run_setup_v2_page.dart
          test/runtime/nova_runtime_integrity_contract_test.dart

      - name: Run runtime integrity contracts
        run: flutter test test/runtime/nova_runtime_integrity_contract_test.dart

      - name: Analyze runtime entry points
        run: >-
          flutter analyze
          lib/main.dart
          lib/core/turn/nova_core_turn_controller.dart
          lib/services/runtime/nova_runtime_graph_service.dart
          lib/services/asr/nova_streaming_asr_runtime_service.dart
          lib/services/asr/nova_streaming_transcript_router_service.dart
          lib/services/audio_runtime/nova_playback_echo_filter_service.dart
          lib/services/identity/nova_voice_identity_bridge_service.dart
          lib/services/stt/nova_speech_to_text_service.dart
          lib/services/tts/nova_tts_service.dart
          lib/ui/launch/nova_launch_gate_page.dart
          lib/ui/onboarding/nova_first_run_setup_v2_page.dart

      - name: Audit packaged native voice stack
        run: |
          chmod +x tooling/audit_native_voice_stack.sh
          tooling/audit_native_voice_stack.sh

      - name: Compile native Kotlin
        id: kotlin_compile
        continue-on-error: true
        shell: bash
        run: |
          set +e
          cd android
          ./gradlew :app:compileDebugKotlin --stacktrace --no-daemon 2>&1 | tee ../nova-kotlin-compile.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload native Kotlin compile log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-kotlin-compile-log
          path: nova-kotlin-compile.log
          if-no-files-found: error
          retention-days: 14

      - name: Enforce native Kotlin compile
        shell: bash
        run: |
          if [[ "${{ steps.kotlin_compile.outputs.exit_code }}" != "0" ]]; then
            echo "Native Kotlin compile failed. Read nova-kotlin-compile-log artifact."
            exit 1
          fi

      - name: Compile debug APK with native models
        id: debug_build
        continue-on-error: true
        shell: bash
        run: |
          set +e
          flutter build apk --debug --no-pub 2>&1 | tee nova-debug-build.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload debug build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-debug-build-log
          path: nova-debug-build.log
          if-no-files-found: error
          retention-days: 14

      - name: Enforce debug APK build
        shell: bash
        run: |
          if [[ "${{ steps.debug_build.outputs.exit_code }}" != "0" ]]; then
            echo "Debug APK failed. Read nova-debug-build-log artifact."
            exit 1
          fi

      - name: Compile ABI-split release APKs
        id: release_build
        continue-on-error: true
        shell: bash
        run: |
          set +e
          flutter build apk --release --split-per-abi --no-pub 2>&1 | tee nova-release-build.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload release build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-release-build-log
          path: nova-release-build.log
          if-no-files-found: error
          retention-days: 14

      - name: Enforce release APK build
        shell: bash
        run: |
          if [[ "${{ steps.release_build.outputs.exit_code }}" != "0" ]]; then
            echo "Release APKs failed. Read nova-release-build-log artifact."
            exit 1
          fi

      - name: Upload test APKs
        uses: actions/upload-artifact@v4
        with:
          name: nova-native-voice-apks
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          if-no-files-found: error
          retention-days: 14

# CI refresh after source-only finalization.
