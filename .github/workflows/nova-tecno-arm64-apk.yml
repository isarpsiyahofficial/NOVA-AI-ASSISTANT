name: Nova TECNO ARM64 APK

on:
  push:
    branches:
      - agent/single-brain-low-latency-runtime
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nova-tecno-arm64-${{ github.ref }}
  cancel-in-progress: true

env:
  SHERPA_ONNX_VERSION: '1.13.2'

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Bootstrap verified Gradle wrapper
        shell: bash
        run: |
          chmod +x tooling/bootstrap_gradle_wrapper.sh
          tooling/bootstrap_gradle_wrapper.sh

      - name: Restore verified voice model cache
        uses: actions/cache@v4
        with:
          path: .cache/nova-native-voice
          key: nova-native-voice-${{ env.SHERPA_ONNX_VERSION }}-${{ hashFiles('tooling/prepare_native_voice_assets.sh') }}
          restore-keys: |
            nova-native-voice-${{ env.SHERPA_ONNX_VERSION }}-

      - name: Provision official native voice assets
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          chmod +x tooling/prepare_native_voice_assets.sh
          tooling/prepare_native_voice_assets.sh

      - name: Install dependencies
        run: flutter pub get

      - name: Verify action and runtime contracts
        run: >-
          flutter test
          test/runtime/nova_runtime_integrity_contract_test.dart
          test/runtime/nova_verified_device_action_contract_test.dart
          test/runtime/nova_contact_call_target_resolver_test.dart

      - name: Build TECNO ARM64 release APK
        shell: bash
        run: |
          flutter build apk --release --target-platform android-arm64 --no-pub
          cp build/app/outputs/flutter-apk/app-release.apk NOVA-TECNO-ARM64-RELEASE.apk
          sha256sum NOVA-TECNO-ARM64-RELEASE.apk | tee NOVA-TECNO-ARM64-RELEASE.sha256
          stat -c 'apk_bytes=%s' NOVA-TECNO-ARM64-RELEASE.apk | tee NOVA-TECNO-ARM64-RELEASE.size.txt

      - name: Upload TECNO ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-TECNO-ARM64-RELEASE
          path: |
            NOVA-TECNO-ARM64-RELEASE.apk
            NOVA-TECNO-ARM64-RELEASE.sha256
            NOVA-TECNO-ARM64-RELEASE.size.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
