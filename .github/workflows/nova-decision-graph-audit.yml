name: Nova Exhaustive Decision Graph Audit

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nova-decision-graph-${{ github.ref }}
  cancel-in-progress: false

jobs:
  exhaustive-decision-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout complete head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply verified typed-authority patch once
        shell: bash
        run: |
          set -euo pipefail
          staging='tooling/.nova_patch_apply'
          if [[ ! -f "$staging/manifest.json" ]]; then
            echo 'Verified patch staging is already absent; continuing with audit.'
            exit 0
          fi

          git show d78e3e3e62f96f4d1dafc61706dc21c2b51dbe83:"$staging/READY" > "$staging/READY"
          git show 3aab4ae752ea42d8c99929e9e6e8062bd4100da3:.github/workflows/nova-decision-graph-audit.yml \
            > .github/workflows/nova-decision-graph-audit.yml

          python - <<'PY'
          import base64
          import gzip
          import hashlib
          import json
          from pathlib import Path

          staging = Path('tooling/.nova_patch_apply')
          manifest_path = staging / 'manifest.json'
          ready_path = staging / 'READY'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          required = {
              'schema', 'partCount', 'base64Length', 'base64Sha256',
              'compressedSha256', 'patchSha256', 'baseHead',
          }
          if set(manifest) != required or manifest.get('schema') != 3:
              raise SystemExit('Patch manifest shape or schema is invalid.')
          manifest_sha = hashlib.sha256(manifest_path.read_bytes()).hexdigest()
          if ready_path.read_text(encoding='utf-8').strip() != manifest_sha:
              raise SystemExit('READY marker does not match manifest SHA-256.')

          count = int(manifest['partCount'])
          expected = [f'{index:03}.part' for index in range(count)]
          actual = sorted(path.name for path in staging.glob('*.part'))
          if actual != expected:
              raise SystemExit(f'Patch part set mismatch: expected={expected}, actual={actual}')
          encoded = ''.join((staging / name).read_text(encoding='ascii') for name in expected)
          if len(encoded) != int(manifest['base64Length']):
              raise SystemExit('Concatenated base64 length mismatch.')
          if hashlib.sha256(encoded.encode('ascii')).hexdigest() != manifest['base64Sha256']:
              raise SystemExit('Concatenated base64 SHA-256 mismatch.')
          compressed = base64.b64decode(encoded, validate=True)
          if hashlib.sha256(compressed).hexdigest() != manifest['compressedSha256']:
              raise SystemExit('Compressed patch SHA-256 mismatch.')
          patch = gzip.decompress(compressed)
          if hashlib.sha256(patch).hexdigest() != manifest['patchSha256']:
              raise SystemExit('Decoded patch SHA-256 mismatch.')
          Path('/tmp/nova-typed-authority.patch').write_bytes(patch)
          PY

          git merge-base --is-ancestor 3aab4ae752ea42d8c99929e9e6e8062bd4100da3 HEAD
          git apply --check --whitespace=error-all /tmp/nova-typed-authority.patch
          git apply --whitespace=error-all /tmp/nova-typed-authority.patch
          rm -f /tmp/nova-typed-authority.patch

          python -m py_compile \
            tooling/audit_decision_graph.py \
            tooling/audit_decision_graph_full.py \
            tooling/classify_quarantined_decision_files.py
          python tooling/classify_quarantined_decision_files.py --strict
          python tooling/audit_decision_graph_full.py --strict
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Apply NOVA typed authority refactor'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

      - name: Compile full decision audit tooling
        run: |
          python -m py_compile \
            tooling/audit_decision_graph.py \
            tooling/audit_decision_graph_full.py \
            tooling/classify_quarantined_decision_files.py \
            tooling/export_source_snapshot_full.py

      - name: Classify dormant decision implementations
        run: python tooling/classify_quarantined_decision_files.py --strict

      - name: Scan every source and configuration file
        id: audit
        continue-on-error: true
        run: python tooling/audit_decision_graph_full.py --strict

      - name: Export complete read-only source snapshot
        if: always()
        run: python tooling/export_source_snapshot_full.py

      - name: Publish audit summary
        if: always()
        run: |
          if [[ -s build/nova-decision-audit/NOVA_DECISION_GRAPH_AUDIT.md ]]; then
            cat build/nova-decision-audit/NOVA_DECISION_GRAPH_AUDIT.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Decision graph audit report was not produced.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload complete decision evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-EXHAUSTIVE-DECISION-GRAPH-AUDIT
          path: build/nova-decision-audit
          if-no-files-found: error
          retention-days: 30

      - name: Enforce zero independent decision paths
        if: steps.audit.outcome != 'success'
        run: |
          echo 'NOVA decision graph still contains blocking conflicts.' >&2
          exit 1
