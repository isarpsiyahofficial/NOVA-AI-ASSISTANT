name: Nova Exhaustive Decision Graph Audit

on:
  push:
    branches:
      - main
      - agent/**
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nova-decision-graph-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exhaustive-decision-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout complete repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build temporary branch snapshot
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git bundle create nova-history.bundle --all
          tar --exclude=.git -czf nova-working-tree.tgz .
          sha256sum nova-history.bundle nova-working-tree.tgz > NOVA_BRANCH_SNAPSHOT_SHA256SUMS
          git log --all --oneline --decorate --graph > nova-git-history.txt
          git log --all --name-status -- tooling/.nova_refactor_bundle > nova-bundle-history.txt

      - name: Upload temporary branch snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-BRANCH-SNAPSHOT
          path: |
            nova-history.bundle
            nova-working-tree.tgz
            NOVA_BRANCH_SNAPSHOT_SHA256SUMS
            nova-git-history.txt
            nova-bundle-history.txt
          if-no-files-found: error
          retention-days: 1

      - name: Compile full decision audit tooling
        run: |
          python -m py_compile \
            tooling/audit_decision_graph.py \
            tooling/audit_decision_graph_full.py \
            tooling/export_source_snapshot_full.py

      - name: Scan every source and configuration file including runtime packages
        id: audit
        continue-on-error: true
        run: |
          chmod +x tooling/audit_decision_graph_full.py
          python tooling/audit_decision_graph_full.py --strict

      - name: Export complete read-only source snapshot including runtime packages
        if: always()
        run: |
          chmod +x tooling/export_source_snapshot_full.py
          python tooling/export_source_snapshot_full.py

      - name: Publish audit summary
        if: always()
        run: |
          if [[ -s build/nova-decision-audit/NOVA_DECISION_GRAPH_AUDIT.md ]]; then
            cat build/nova-decision-audit/NOVA_DECISION_GRAPH_AUDIT.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Decision graph audit report was not produced.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload complete decision evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-EXHAUSTIVE-DECISION-GRAPH-AUDIT
          path: build/nova-decision-audit
          if-no-files-found: error
          retention-days: 30

      - name: Enforce zero independent decision paths
        if: steps.audit.outcome != 'success'
        run: |
          echo 'NOVA decision graph still contains blocking conflicts.' >&2
          exit 1
