name: Nova Exhaustive Decision Graph Audit

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nova-decision-graph-${{ github.ref }}
  cancel-in-progress: false

jobs:
  exhaustive-decision-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout complete head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Decode and verify final fixes
        if: ${{ hashFiles('tooling/.nova_final_fix.patch.gz.b64') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path
          source = Path('tooling/.nova_final_fix.patch.gz.b64')
          encoded = source.read_text(encoding='ascii').strip()
          if len(encoded) != 7168:
              raise SystemExit(f'Final-fix base64 length mismatch: {len(encoded)}')
          if hashlib.sha256(encoded.encode('ascii')).hexdigest() != '07eae0bba3afabf8638f1af7f40ae954a62fe1e4c34ee0102a585bea0756dcf5':
              raise SystemExit('Final-fix base64 SHA-256 mismatch.')
          compressed = base64.b64decode(encoded, validate=True)
          if hashlib.sha256(compressed).hexdigest() != '29e4acfe193691af224eb39814ffdb38653a93c3a75a19f159f89aafda374582':
              raise SystemExit('Final-fix compressed SHA-256 mismatch.')
          patch = gzip.decompress(compressed)
          if hashlib.sha256(patch).hexdigest() != '7804891996c5ecd3436f26b1916802c634c61bc889d4822448e58026e49fda86':
              raise SystemExit('Final-fix patch SHA-256 mismatch.')
          Path('/tmp/nova-final-fixes.patch').write_bytes(patch)
          print(f'Verified final patch: {len(patch)} bytes')
          PY

      - name: Check final-fix applicability
        if: ${{ hashFiles('tooling/.nova_final_fix.patch.gz.b64') != '' }}
        run: git apply --check --whitespace=error-all /tmp/nova-final-fixes.patch

      - name: Apply final Telecom and AudioSocket fixes
        if: ${{ hashFiles('tooling/.nova_final_fix.patch.gz.b64') != '' }}
        run: |
          set -euo pipefail
          git apply --whitespace=error-all /tmp/nova-final-fixes.patch
          rm -f /tmp/nova-final-fixes.patch tooling/.nova_final_fix.patch.gz.b64
          git diff --check

      - name: Validate final source tree
        run: |
          set -euo pipefail
          python -m py_compile \
            tooling/audit_decision_graph.py \
            tooling/audit_decision_graph_full.py \
            tooling/classify_quarantined_decision_files.py \
            tooling/verify_nova_acceptance.py
          bash -n infra/call-bridge/run_e2e.sh
          bash -n tooling/run_android_telecom_emulator_e2e.sh
          python tooling/classify_quarantined_decision_files.py --strict
          python tooling/audit_decision_graph_full.py --strict
          git diff --check

      - name: Commit source-only final fixes
        id: source_commit
        shell: bash
        run: |
          set -euo pipefail
          git checkout HEAD -- .github/workflows
          if git diff --quiet && git diff --cached --quiet; then
            echo 'created=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix real Telecom and AudioSocket verification'
          echo 'created=true' >> "$GITHUB_OUTPUT"

      - name: Push source-only final fixes
        if: steps.source_commit.outputs.created == 'true'
        run: git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

      - name: Run exhaustive decision graph audit
        id: audit
        continue-on-error: true
        run: python tooling/audit_decision_graph_full.py --strict

      - name: Export complete read-only source snapshot
        if: always()
        run: python tooling/export_source_snapshot_full.py

      - name: Publish audit summary
        if: always()
        run: |
          if [[ -s build/nova-decision-audit/NOVA_DECISION_GRAPH_AUDIT.md ]]; then
            cat build/nova-decision-audit/NOVA_DECISION_GRAPH_AUDIT.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload complete decision evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-EXHAUSTIVE-DECISION-GRAPH-AUDIT
          path: build/nova-decision-audit
          if-no-files-found: error
          retention-days: 30

      - name: Enforce zero independent decision paths
        if: steps.audit.outcome != 'success'
        run: exit 1
