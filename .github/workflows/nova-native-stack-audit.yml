name: Nova Native Stack Audit

on:
  push:
    branches:
      - agent/**
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nova-native-audit-${{ github.ref }}
  cancel-in-progress: true

env:
  SHERPA_ONNX_VERSION: '1.13.2'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore verified voice model cache
        uses: actions/cache@v4
        with:
          path: .cache/nova-native-voice
          key: nova-native-voice-${{ env.SHERPA_ONNX_VERSION }}-${{ hashFiles('tooling/prepare_native_voice_assets.sh') }}
          restore-keys: |
            nova-native-voice-${{ env.SHERPA_ONNX_VERSION }}-

      - name: Provision official sherpa voice assets
        id: provision
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          chmod +x tooling/prepare_native_voice_assets.sh
          set +e
          bash -x tooling/prepare_native_voice_assets.sh 2>&1 | tee nova-native-provision.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload provisioning report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-native-provision
          path: nova-native-provision.log
          if-no-files-found: error
          retention-days: 14

      - name: Audit packaged voice stack
        id: audit
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          chmod +x tooling/audit_native_voice_stack.sh
          set +e
          tooling/audit_native_voice_stack.sh 2>&1 | tee nova-native-stack-audit.txt
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload native audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-native-stack-audit
          path: nova-native-stack-audit.txt
          if-no-files-found: error
          retention-days: 14

      - name: Enforce native stack completeness
        if: always()
        shell: bash
        run: |
          provision_code="${{ steps.provision.outputs.exit_code }}"
          audit_code="${{ steps.audit.outputs.exit_code }}"
          if [[ "$provision_code" != "0" ]]; then
            echo "Native asset provisioning failed. Read nova-native-provision artifact."
            exit 1
          fi
          if [[ "$audit_code" != "0" ]]; then
            echo "Native voice stack is incomplete. Read nova-native-stack-audit artifact."
            exit 1
          fi
