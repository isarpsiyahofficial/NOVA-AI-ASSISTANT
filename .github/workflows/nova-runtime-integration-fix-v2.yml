name: NOVA Runtime Integration Fix V2

on:
  push:
    branches:
      - agent/single-brain-low-latency-runtime
    paths:
      - tooling/.nova_runtime_integration/run_transformer.py
      - .github/workflows/nova-runtime-integration-fix-v2.yml
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nova-runtime-integration-fix-v2
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: github.repository == 'isarpsiyahofficial/NOVA-AI-ASSISTANT'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout real feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/single-brain-low-latency-runtime
          fetch-depth: 0
          show-progress: false

      - name: Apply verified source transformations
        id: transform
        continue-on-error: true
        shell: bash
        run: python tooling/.nova_runtime_integration/run_transformer.py > nova-runtime-transform.log 2>&1

      - name: Upload transformation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-RUNTIME-TRANSFORM-V2-LOG
          path: nova-runtime-transform.log
          if-no-files-found: error
          retention-days: 7

      - name: Enforce source transformation
        if: steps.transform.outcome != 'success'
        shell: bash
        run: |
          cat nova-runtime-transform.log
          exit 1

      - name: Set up Flutter
        if: steps.transform.outcome == 'success'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        if: steps.transform.outcome == 'success'
        run: flutter pub get

      - name: Format hardened runtime files
        if: steps.transform.outcome == 'success'
        run: >-
          dart format
          lib/core/api/nova_secure_token_store.dart
          lib/services/permissions/nova_android_permission_bridge_service.dart
          lib/services/identity/voice_authorization_runtime_service.dart
          lib/services/system/nova_continuous_listening_runtime_service.dart
          lib/services/api/api_service.dart
          lib/ui/dashboard/dashboard_page.dart
          lib/ui/launch/nova_launch_gate_page.dart
          test/runtime/nova_background_authority_contract_test.dart

      - name: Run background authority contracts
        if: steps.transform.outcome == 'success'
        run: >-
          flutter test
          test/runtime/nova_background_authority_contract_test.dart
          test/runtime/nova_runtime_integrity_contract_test.dart

      - name: Analyze activated runtime entry points
        if: steps.transform.outcome == 'success'
        run: >-
          flutter analyze
          lib/main.dart
          lib/core/api/nova_secure_token_store.dart
          lib/services/permissions/nova_android_permission_bridge_service.dart
          lib/services/identity/voice_authorization_runtime_service.dart
          lib/services/system/nova_continuous_listening_runtime_service.dart
          lib/services/api/api_service.dart
          lib/ui/dashboard/dashboard_page.dart
          lib/ui/launch/nova_launch_gate_page.dart

      - name: Build hardened debug APK
        if: steps.transform.outcome == 'success'
        run: flutter build apk --debug --no-pub

      - name: Publish hardened runtime and remove staging
        if: steps.transform.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tooling/.nova_runtime_integration
          rm -f .github/workflows/nova-runtime-integration-fix.yml
          rm -f .github/workflows/nova-runtime-integration-fix-v2.yml
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/nova-runtime-integrity.yml')
          text = path.read_text(encoding='utf-8')
          marker = '  # BEGIN ONE_SHOT_RUNTIME_INTEGRATION'
          if marker in text:
              text = text[:text.index(marker)].rstrip() + '\n'
          text = text.replace(
              'permissions:\n  contents: write',
              'permissions:\n  contents: read',
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY
          git add -A
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Apply NOVA runtime integration hardening'
          git push origin HEAD:agent/single-brain-low-latency-runtime
